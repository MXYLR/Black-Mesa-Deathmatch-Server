// ============================================================================
// SourceBans++ 管理员分组 —— sb_admins.cfg 里 "group" 字段引用的就是这里的名字。
//
//   它和上层 configs/admin_groups.cfg(SourceMod 自带的那套)是两回事:
//     admin_groups.cfg  —— 本地文件型分组,给 admins.cfg 用
//     sb_admin_groups.cfg —— SourceBans 数据库型分组,给 sb_admins.cfg 用
//   两套都留着是为了"数据库连不上时本地名单还能兜底",所以改权限时通常两边
//   都要改,否则会出现在 SourceBans 后台改了权限、游戏里没变的怪现象。
//
//   "flags" 权限字母见 ../admin_levels.cfg;"immunity" 数字大的管不了数字小的。
//   分组本身不含任何站点相关信息,一般照抄即可,除非你要增删分组。
// ============================================================================
"Groups"
{
	"admin"
	{
		"flags"		"abcdefghjkn"
		"immunity"		"25"
	}
	"superadmin"
	{
		"flags"		"z"
		"immunity"		"100"
	}
}
