// ============================================================================
// SourceBans++ 管理员名单 —— ★★ 全部是占位 SteamID,部署前必须整体替换。
//
//   与上层 configs/admins.cfg 的区别(两个文件都要改,不要只改一个):
//     admins.cfg     —— SourceMod 自带的文件型名单,服务器本地就能生效
//     sb_admins.cfg  —— SourceBans++ 从数据库同步的名单,覆盖上面那一份
//     SourceBans 联上数据库后以本文件(数据库)为准,所以只改 admins.cfg 会发现
//     "自己在面板里有权限、在数据库里没有",或者反过来。
//
//   "group" 引用的是 sb_admin_groups.cfg 里定义的分组名(superadmin / admin),
//   "flags" 是额外的权限字母,见 ../admin_levels.cfg。
//   "immunity" 数字大的管不了数字小的。
//   >>> 这里的 SteamID 必须与 admins.cfg 中同一人的值保持一致。
// ============================================================================
"Admins"
{
