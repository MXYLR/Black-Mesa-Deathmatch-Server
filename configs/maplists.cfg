/**
 * Use this file to configure map lists.
 *
 * ============================================================================
 * 地图列表的"路由表"。一般不需要改它,真正的地图清单在别处:
 *
 *   >>> 想改混战/比赛可选的地图,改这两个文件:
 *       smx_analysis/src/scripting/cfg/mapcycle_ffa.txt   (混战 / ffa)
 *       smx_analysis/src/scripting/cfg/mapcycle_tdm.txt   (团队 / tdm)
 *       —— 由 bms_match.cfg 里 Gamemodes 段的 "Mapcycle" 字段指定文件名。
 *
 *   >>> 想让 !map / !votemap 菜单列出"本机实际装了哪些图",
 *       改同目录的 adminmenu_maplist.ini(本仓库没有收录它,SourceMod 找不到时
 *       会自动回落到 mapcyclefile,也就是 mapcycle.txt)。
 *
 *   本文件只在"某个插件请求某份列表该去哪个文件读"时才起作用;
 *   想把某个列表改成从 mapcycle.txt 读,把它的 file 行换成 target 行即可。
 * ============================================================================
 *
 * Each section is a map list that plugins can use.  For example, the Admin Menu 
 * requests an "admin menu" map list, and you can control which maps appear via 
 * this file.
 *
 * Each section must have a property that explains where to read the maps from.
 * There are two properties:
 *
 *    target         - Redirect the request to another section.
 *    file			 - Read a file of map names, in mapcycle.txt format.
 *
 * There is one section by default, called "mapcyclefile" - it is mapped to the 
 * mapcycle.txt file, or whatever the contents of your mapcyclefile cvar is.
 *
 * If a plugin requests a map list file which doesn't exist, or is empty, SourceMod 
 * tries the "default" section, and then the "mapcyclefile" section.
 */
"MapLists"
{
	/**
	 * Default requests go right to the mapcyclefile.
	 */
	"default"
	{
		"target"		"mapcyclefile"
	}
	
	/* Admin menu, map menu */
	"sm_map menu"
	{
		"file"			"addons/sourcemod/configs/adminmenu_maplist.ini"
	}
	
	/* Admin menu, map voting menu */
	"sm_votemap menu"
	{
		"file"			"addons/sourcemod/configs/adminmenu_maplist.ini"
	}
	
	/* For the "randomcycle" plugin */
	"randomcycle"
	{
		"target"		"default"
	}
	
	/* For the "mapchooser" plugin */
	"mapchooser"
	{
		"target"		"default"
	}
	
	/* For the "nominations" plugin */
	"nominations"
	{
		"target"		"default"
	}
}
