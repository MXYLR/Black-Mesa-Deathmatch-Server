"bms_match"
{
	// ---- Core settings ----
	"VoteMinPlayers"	"3"
	"VoteMaxTime"		"25"
	"VoteCooldown"		"30"
	"AutoVoting"		"1"
	"DefaultMode"		"ffa"
	"RetainModes"		"ffa,tdm"
	"PreMatchCommand"	"exec server_match"
	"PostMatchCommand"	"exec server_match_post"

	// ---- SourceTV recording ----
	"SourceTV"
	{
		"Enable"		"1"
		"DemoDir"		"demos"
		// DownloadBase: 与 sv_downloadurl 同址的 nginx(8080)。demo 走 /demos alias;
		"DownloadBase"	"http://你的公网IP或域名:8080/"
	}

	"Gamemodes"
	{
		"ffa"
		{
			"Name"			"ffa"
			"Command"		"mp_teamplay 0"
			"Mapcycle"		"mapcycle_ffa.txt"
			"Defaultmap"	"dm_lambdabunker"
			"Matchable"		"1"
			"Overtime"		"1"
			"MatchTimelimit"	"15"
		}
		"tdm"
		{
			"Name"			"tdm"
			"Command"		"mp_teamplay 1"
			"Mapcycle"		"mapcycle_tdm.txt"
			"Defaultmap"	"dm_lambdabunker"
			"Matchable"		"1"
			"Overtime"		"1"
			"MatchTimelimit"	"15"
		}
	}

	"Maps"
	{
		"StripPrefix"	"dm_,bms_,bms2_"
		"DefaultModes"
		{
			"dm_*"	"ffa"
		}
		"Abbreviations"
		{
			"bunker"	"dm_lambdabunker"
			"bounce"	"dm_bounce"
			"stalk"		"dm_stalkyard"
			"sub"		"dm_subtransit"
			"gas"		"dm_gasworks"
			"rail"		"dm_rail"
			"crossfire"	"dm_crossfire"
			"boom"		"dm_boom"
		}
	}
}
