// ============================================================================
// bms_match(已并入 BMAG.smx)的主配置
//
// ★★ 部署前必须改的只有一处:下面 SourceTV 段的 "DownloadBase" ——
//    那是本站的公网地址,照抄会让你的录像下载链接指向别人的服务器。
//    没有 FastDL 就把它留空(""),录像仍会录到 Server 的 demos/ 目录里,
//    只是赛后广播的下载链接不可用,改为手动取文件。
//
//    其它字段是"玩法调参",可以照抄;想改的含义:
//      VoteMinPlayers  发起 !start 比赛投票所需的最少人数(含 bot)
//      VoteMaxTime     投票持续秒数
//      VoteCooldown    两次投票之间的冷却秒数
//      AutoVoting      1 = 满足人数自动发起比赛投票
//      DefaultMode     默认模式,对应下面 Gamemodes 段的 key
//      RetainModes     这些模式之间切换时保留比分/不重置
//      PreMatchCommand / PostMatchCommand  开赛前/结束后执行的 cfg
//      Gamemodes/*/Mapcycle     该模式用哪份地图轮换文件
//      Gamemodes/*/Defaultmap   该模式默认图,注意必须是你服务器上有且属于该模式的图
//      Gamemodes/*/MatchTimelimit  单场时长(分钟)
//      Maps/StripPrefix   地图名里这些前缀在菜单里会被去掉(只是为了好看)
//      Maps/Abbreviations 地图简称 -> 全名,给 !start bunker 这种缩写用
//      >>> 换地图池时:Maps/Abbreviations 和上面两份 mapcycle_*.txt 要一起改
// ============================================================================
"bms_match"
{
	// ---- Core settings ----
	"VoteMinPlayers"	"3"
	"VoteMaxTime"		"25"
	"VoteCooldown"		"30"
	"AutoVoting"		"1"
	"DefaultMode"		"ffa"
	"RetainModes"		"ffa,tdm"
	"PreMatchCommand"	"exec server_match"
	"PostMatchCommand"	"exec server_match_post"

	// ---- SourceTV recording ----
	"SourceTV"
	{
		"Enable"		"1"
		"DemoDir"		"demos"
		// DownloadBase: demo 下载地址前缀,赛后广播给玩家的链接 = 它 + 文件名。
		// >>> 必须换成你自己的公网地址;没有 FastDL 就留空 ""。
		//     应与 cfg/server.cfg 里的 sv_downloadurl 同址(同一个 HTTP 服务)。
		"DownloadBase"	"http://你的公网IP或域名:8080/"
	}

	"Gamemodes"
	{
		"ffa"
		{
			"Name"			"ffa"
			"Command"		"mp_teamplay 0"
			"Mapcycle"		"mapcycle_ffa.txt"
			"Defaultmap"	"dm_lambdabunker"
			"Matchable"		"1"
			"Overtime"		"1"
			"MatchTimelimit"	"15"
		}
		"tdm"
		{
			"Name"			"tdm"
			"Command"		"mp_teamplay 1"
			"Mapcycle"		"mapcycle_tdm.txt"
			"Defaultmap"	"dm_lambdabunker"
			"Matchable"		"1"
			"Overtime"		"1"
			"MatchTimelimit"	"15"
		}
	}

	"Maps"
	{
		"StripPrefix"	"dm_,bms_,bms2_"
		"DefaultModes"
		{
			"dm_*"	"ffa"
		}
		"Abbreviations"
		{
			"bunker"	"dm_lambdabunker"
			"bounce"	"dm_bounce"
			"stalk"		"dm_stalkyard"
			"sub"		"dm_subtransit"
			"gas"		"dm_gasworks"
			"rail"		"dm_rail"
			"crossfire"	"dm_crossfire"
			"boom"		"dm_boom"
		}
	}
}
