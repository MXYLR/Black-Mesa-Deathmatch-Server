// ============================================================================
// Black Mesa 专用服务器主配置(公服)
//
// ★★ 这是部署时第一个要改的文件。下面所有带 >>> 的行都含本站专属信息,
//    直接照抄会在你的服务器上留下别人的名字、域名和群号。
//
//    >>> 必须修改(逐条):
//      hostname            服务器浏览器里显示的名字
//      sv_region           你服务器的地区代号(对照下方的表)
//      sv_downloadurl      FastDL 地址;没有 FastDL 就整行注释掉,
//                          玩家会退回 srcds 直传(慢,但能正常连)
//      sm_motd_url         !motd 面板指向的网页
//      tv_title / tv_name  SourceTV 的名字
//      is_weaponfix_saddr  必须是外网玩家连得到的公网地址(不能是 127.0.0.1)
//      maxplayers          你的槽位上限
//      sv_password         留空 = 公开服;填值 = 进服要密码
//
//    >>> 本文件里没有、但你必须自己设的:
//      rcon_password       在启动参数里加 +rcon_password "你的密码"。
//                          绝对不要写进本文件再提交到 git —— 本仓库的历史里
//                          就曾经泄露过一次,改密码也删不掉旧提交。
//
//    可以保留默认:mp_warmup_time / mp_timelimit / mp_fraglimit /
//    mp_teamplay 等玩法参数(比赛流程另由 bms_match.cfg + server_match.cfg 接管)
// ============================================================================
// Black Mesa server.cfg file
hostname "[CN Match Server] BrightSu 混战/比赛 | Q群1015295897"   // >>> 改成你自己的服务器名

sv_region 4   // >>> 改成你的地区:0=美东 1=美西 2=南美 3=欧洲 4=亚洲 5=澳洲 6=中东 7=非洲


//exec rate_66tick
//exec rate_100tick
//exec rate_128tick

sv_lan 0
log on
sv_cheats 0
cl_updaterate 128
cl_cmdrate 128

mp_warmup_time 10

// 30 分钟
mp_timelimit 1800

// 100 杀敌数
mp_fraglimit 100

// 个人竞技
mp_teamplay 0


sm_blockcommand "spec_mode 7"

mp_forcerespawn 1
player_respawn_protection_time 0
sm_say "player_respawn_protection_time is 0"

// 允许进入观察者模式(hl2mp 的 jointeam 1/spectate 在服务端用它门控,
// 若为 0 会打印 #Cannot_Be_Spectator 并拒绝观战)
mp_allowspectators 1

// 零秒重生:无论公服混战还是比赛,死亡后立即重生(比赛期间 bms_match 不再干预)。
sm_fastspawn 1
sm_fastspawn_time 0.0

// ===== FastDL / 自定义内容下载 =====
// >>> 换图/换模型时玩家要不要下载地图包,就靠这一行。
//     本仓库已不再附带 FastDL 服务端(早先那套单机 nginx 方案已删),
//     你要么自己搭一个 HTTP 服务(把 /maps 与 /demos 放上去),
//     要么把下面这行整行注释掉 —— 取消后走 srcds 直传,功能正常但很慢。
//     两个地方要填同一个地址:本行 sv_downloadurl,以及
//     smx_analysis/src/scripting/configs/bms_match.cfg 里的 SourceTV/DownloadBase。
//     端口(示例用 8080)记得在防火墙和端口映射里放行,与 27015 同法。
//sv_downloadurl "https://dl.new-page.xyz/bm"
//sv_downloadurl "http://is-server.de/downloads/bms/"
//sv_downloadurl "http://onetale.xyz/bms/"
//sv_downloadurl "http://gsdl.brightsu.cn/gameservers/bms/"
sv_downloadurl "http://你的公网IP或域名:8080/"   // >>> 换成你自己的地址,或注释掉
sm_motd_url "https://my.brightsu.cn/projects/bms/playersol-ag.php"   // >>> 换成你自己的 MOTD 网页(也可留空)
sv_allowdownload 1
sv_allowupload 1
sv_always_run 1
sm_say "sv_alwaysrun is 1"
sm_advertisements_interval 600

// SourceTV
tv_enable 1
tv_autorecord 0
tv_title "[CN] QQ 群 1015295897"   // >>> 改成你自己的
tv_name "[CN] QQ 群 1015295897"    // >>> 改成你自己的

mp_forcerespawn 1
mp_friendlyfire 0
mp_flashlight 0
mp_show_voice_icons 1
sv_alltalk 1
sm_say "sv_alltalk is 1"

maxplayers 8   // >>> 改成你的槽位上限

sm_downloader_enabled "1"

sv_password ""   // >>> 留空 = 公开服;填值 = 进服需要密码

// is_weaponfx 客户端动画预热插件:玩家入服后假连本地址预缓存武器动画再重连
// (修 MP 武器/RPG 换弹动画不显示)。插件把默认值视为"未配置"会自我禁用,
// 必须显式设置。
// >>> 改成你的公网地址(域名或公网 IP,带上 :端口),外网玩家必须连得到。
//     端口已被 srcds 占用也没关系 —— 这个地址只做一次假连,不会被真的连上。
is_weaponfix_saddr "127.0.0.1:27015"

// hl1tau 插件:全量重写 weapon_tau 为 HL1 gauss 行为。
// 人类玩家由插件接管(OnPlayerRunCmd 抑制原生开火/蓄力,自建 HL1 光束)。
// bot 绕过 OnPlayerRunCmd 仍走原生 tau,这里拉大过载阈值以禁用 BM 原生
// 过载爆炸(75 伤害/200 半径),避免 bot 蓄力 >7.5s 触发非 HL1 行为。
sk_weapon_tau_overcharge_time 9999

// 比赛配置
//exec server_match.cfg

// 允许游戏暂停
sv_pausable 1

heartbeat
writeid
writeip
