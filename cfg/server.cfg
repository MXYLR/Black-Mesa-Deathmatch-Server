// Black Mesa server.cfg file
hostname "[CN Match Server] BrightSu 混战/比赛 | Q群1015295897"

sv_region 4
// 0 = US East, 1 = US West, 2 = South America, 3 = Europe, 4 = Asia, 5 = Australia, 6 = Middle East, 7 = Africa:


//exec rate_66tick
//exec rate_100tick
//exec rate_128tick

sv_lan 0
log on
sv_cheats 0
cl_updaterate 128
cl_cmdrate 128

mp_warmup_time 10

// 30 分钟
mp_timelimit 1800

// 100 杀敌数
mp_fraglimit 100

// 个人竞技
mp_teamplay 0


sm_blockcommand "spec_mode 7"

mp_forcerespawn 1
player_respawn_protection_time 0
sm_say "player_respawn_protection_time is 0"

// 允许进入观察者模式(hl2mp 的 jointeam 1/spectate 在服务端用它门控,
// 若为 0 会打印 #Cannot_Be_Spectator 并拒绝观战)
mp_allowspectators 1

// 零秒重生:无论公服混战还是比赛,死亡后立即重生(比赛期间 bms_match 不再干预)。
sm_fastspawn 1
sm_fastspawn_time 0.0

// ===== FastDL 单机 nginx(F:/BMServer,8080)=====
// 启动时由 start_server.bat -> fastdl_start.bat 自动拉起 nginx;文件由
// F:/BMServer/build_fastdl.py 生成(硬链接 raw + 自定义图 bz2)。SourceTV demo
// 也走同一 nginx 的 /demos(bms_match.cfg DownloadBase 同理改为 :8080/)。
// >>> 先做端口映射 <<< 把 TCP 8080 与 27015 同法映射到公网并放行防火墙,再
//     把下面地址换成你的公网IP/域名。未映射或填错时玩家自动回退 srcds 直传。
//sv_downloadurl "https://dl.new-page.xyz/bm"
//sv_downloadurl "http://is-server.de/downloads/bms/"
//sv_downloadurl "http://onetale.xyz/bms/"
//sv_downloadurl "http://gsdl.brightsu.cn/gameservers/bms/"
sv_downloadurl "http://你的公网IP或域名:8080/"
sm_motd_url "https://my.brightsu.cn/projects/bms/playersol-ag.php"
sv_allowdownload 1
sv_allowupload 1
sv_always_run 1
sm_say "sv_alwaysrun is 1"
sm_advertisements_interval 600

// SourceTV
tv_enable 1
tv_autorecord 0
tv_title "[CN] QQ 群 1015295897"
tv_name "[CN] QQ 群 1015295897"

mp_forcerespawn 1
mp_friendlyfire 0
mp_flashlight 0
mp_show_voice_icons 1
sv_alltalk 1
sm_say "sv_alltalk is 1"

maxplayers 8

sm_downloader_enabled "1"

sv_password ""

// is_weaponfx 客户端动画预热插件:玩家入服后假连本地址预缓存武器动画再重连
// (修 MP 武器/RPG 换弹动画不显示)。插件把默认值视为"未配置"会自我禁用,
// 必须显式设置。
// TODO: 生产服必须填外网玩家可连的公网地址(域名或公网 IP),不能是 127.0.0.1
// (否则外网玩家假连失败,插件虽启用但动画修复无效)。
is_weaponfix_saddr "127.0.0.1:27015"

// hl1tau 插件:全量重写 weapon_tau 为 HL1 gauss 行为。
// 人类玩家由插件接管(OnPlayerRunCmd 抑制原生开火/蓄力,自建 HL1 光束)。
// bot 绕过 OnPlayerRunCmd 仍走原生 tau,这里拉大过载阈值以禁用 BM 原生
// 过载爆炸(75 伤害/200 半径),避免 bot 蓄力 >7.5s 触发非 HL1 行为。
sk_weapon_tau_overcharge_time 9999

// 比赛配置
//exec server_match.cfg

// 允许游戏暂停
sv_pausable 1

heartbeat
writeid
writeip
