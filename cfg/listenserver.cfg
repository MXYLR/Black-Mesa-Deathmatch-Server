// Listen server 不会自动执行 server.cfg(Source 引擎启动时只尝试本文件),
// 这里直接引用同一份参数基准,保证公服(专用服务器)与测试机(listen)行为一致。
// 2026-08-24 实锤:测试机(游戏内建服)此前从未执行 server.cfg,导致
// sm_fastspawn_time=3.0、tv_enable=0、is_weaponfix_saddr 未设等一连串问题。
//
// ★ 部署提示:本文件不需要你改任何东西。它只是把 server.cfg 引进来,
//   服务器参数一律在 server.cfg 里改。若你的目录结构不同,确认 server.cfg
//   与本文件同级(都在 Black Mesa/bms/cfg/)。
exec server.cfg
