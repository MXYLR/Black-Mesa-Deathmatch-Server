// server_match.cfg - executed when a match starts (MatchWait)
// Adjust values to your server. server_match_post.cfg restores the public values.
// Note: mp_teamplay is NOT set here - it follows the current gamemode.
mp_timelimit 15
mp_fraglimit 0
mp_forcerespawn 1
mp_friendlyfire 0
sv_alltalk 0
sv_pausable 1

// SourceTV resident: BM only records when tv_enable is 1 at map load (match demos)
tv_enable 1
